[tws]
host = 127.0.0.1
# IBKR API port — pick the one matching your client and account mode:
#   TWS         Live: 7496   Paper: 7497
#   IB Gateway  Live: 4001   Paper: 4002
port = 4002
client_id = 999

[server]
ws_host = 127.0.0.1
ws_port = 8765

[execution]
managed_reprice_threshold_default = 0.01
managed_reprice_interval_seconds = 2.0
managed_reprice_max_updates = 12
managed_reprice_timeout_seconds = 600

[market_data]
# Live data source for the live page: futu | ibkr.
#   futu: read-only research mode via FutuOpenD (free LV3/LV1). No trading.
#   ibkr: production mode via ib_server.py (requires paid IBKR subscriptions).
live_source = futu

# IBKR market data type passed to reqMarketDataType() (only used when live_source = ibkr):
#   1 = Live           (requires a live market-data subscription on the IBKR account)
#   2 = Frozen         (last quote when market closes; still needs live subscription)
#   3 = Delayed        (15-20 min delay; no subscription required)
#   4 = Delayed Frozen (delayed live during hours + last cached quote when feed closes)
data_type = 3

[futu]
# FutuOpenD gateway (must be running locally and logged in).
host = 127.0.0.1
port = 11111
# password 可选（OpenD 加密时使用）。
# password =
